<!DOCTYPE html>
<head>
    <title>Login Page</title>

    <style>
        body {
            
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Login</h2>

        <form>

            <label>Email:</label>
            <input type="email" placeholder="Enter Email" required>

            <label>Password:</label>
            <input type="password" placeholder="Enter Password" required minlength="8" maxlength="12">
            <button type="submit">Login </button>
            
    </form>
    </div>



</body>
</html>
